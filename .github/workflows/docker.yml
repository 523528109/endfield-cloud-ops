name: docker

on:
  push:
    branches: [main]
    paths:
      - "docker/**"
      - "panel/**"
      - ".github/workflows/docker.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          push: true
          tags: |
            xl233/endfield-cloud-ops:latest
            xl233/endfield-cloud-ops:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test
        run: |
          docker run -d --name endfield-smoke -p 8787:8787 xl233/endfield-cloud-ops:latest
          ok=0
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8787/ >/dev/null 2>&1; then ok=1; break; fi
            sleep 1
          done
          docker logs endfield-smoke | tail -50
          docker rm -f endfield-smoke
          test "$ok" = "1"
