name: docker

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: xl233/endfield-cloud-ops
          tags: |
            type=raw,value=latest
            type=sha,format=long
            type=ref,event=tag

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test
        run: |
          docker run --rm --entrypoint /bin/bash xl233/endfield-cloud-ops:latest -lc 'tesseract --list-langs 2>/dev/null | grep -qx chi_sim'
          docker run -d --name endfield-smoke -p 8787:8787 xl233/endfield-cloud-ops:latest
          ok=0
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8787/ >/dev/null 2>&1; then ok=1; break; fi
            sleep 1
          done
          docker logs endfield-smoke | tail -50
          docker rm -f endfield-smoke
          test "$ok" = "1"

  build-full:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: xl233/endfield-cloud-ops
          tags: |
            type=raw,value=full
            type=raw,value=full-sha-${{ github.sha }}
            type=ref,event=tag,prefix=full-

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.full
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test full image
        run: |
          docker run --rm --entrypoint /bin/bash xl233/endfield-cloud-ops:full -lc 'test -x /home/maa/maaend/MaaEnd && /home/maa/venv/bin/python -c "import maa; print(maa.__file__)" && tesseract --list-langs 2>/dev/null | grep -qx chi_sim'
          docker run -d --name endfield-full-smoke -p 8788:8787 xl233/endfield-cloud-ops:full
          ok=0
          for i in $(seq 1 45); do
            if curl -fsS http://127.0.0.1:8788/ >/dev/null 2>&1; then ok=1; break; fi
            sleep 1
          done
          docker logs endfield-full-smoke | tail -80
          docker rm -f endfield-full-smoke
          test "$ok" = "1"
